version: '3.8'

services:
  blockchain-server-sqlite:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
    container_name: blockchain-sqlite
    environment:
      - DATABASE_URL=sqlite:/data/blockchain.db
      - PORT=8080
      - RUST_LOG=info
    ports:
      - "8080:8080"
    volumes:
      # Volume persistant pour la base de données SQLite
      - blockchain_data:/data
    networks:
      - blockchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  blockchain_data:
    driver: local

networks:
  blockchain-network:
    driver: bridge