services:
  blockchain-server:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
    container_name: egovern-blockchain
    ports:
      - "8080:8080"
    volumes:
      - blockchain_data:/app/data
      - blockchain_logs:/app/logs
    environment:
      - RUST_LOG=info
      - DATABASE_URL=./data/blockchain.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    container_name: egovern-gateway
    command: ["/app/api-gateway-persistent"]
    ports:
      - "8081:8081"
    depends_on:
      - blockchain-server
    environment:
      - RUST_LOG=info
      - BLOCKCHAIN_URL=http://blockchain-server:8080
      - DATABASE_URL=sqlite:///app/data/database.db
      - PORT=8081
    restart: unless-stopped
    volumes:
      - gateway_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web-interface:
    build:
      context: .
      dockerfile: Dockerfile.web-only
    container_name: egovern-web
    command: ["./target/release/web-interface"]
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      - API_URL=http://api-gateway:8081
    restart: unless-stopped

volumes:
  blockchain_data:
    driver: local
  blockchain_logs:
    driver: local
  gateway_data:
    driver: local

networks:
  default:
    name: egovern-network
