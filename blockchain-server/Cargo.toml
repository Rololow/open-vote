[package]
name = "blockchain-server"
version.workspace = true
edition.workspace = true
description = "Serveur blockchain pour le système e-gouvernement"

[[bin]]
name = "blockchain-server"
path = "src/main.rs"

[lib]
name = "blockchain_server"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Modules locaux
common = { path = "../common", features = ["identity"] }
crypto-lib = { path = "../crypto-lib" }

# Réseau et API
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Base de données
sqlx = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP Client pour migration
reqwest = { version = "0.11", features = ["json"] }

# Cryptographie
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.21"
bs58 = "0.5"

[features]
# Pass-through feature to activate identity-related code (DID/VC) from common crate.
# Enable by default so API identity endpoints are active in tests and typical runs.
default = ["identity"]
identity = ["common/identity"]
