version: '3.8'

services:
  # Serveur Blockchain Rust
  blockchain-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egovern-blockchain-real
    ports:
      - "5000:8080"  # API blockchain sur le port 5000 pour compatibilité avec l'interface web
    environment:
      - BLOCKCHAIN_NODE_ID=node-primary
      - BLOCKCHAIN_BIND_ADDRESS=0.0.0.0
      - BLOCKCHAIN_API_PORT=8080
      - BLOCKCHAIN_DATABASE_URL=sqlite:./data/blockchain.db
      - BLOCKCHAIN_DATA_DIR=./data
      - BLOCKCHAIN_ENABLE_MINING=true
      - RUST_LOG=debug
      - RUST_BACKTRACE=full
    volumes:
      - blockchain_data:/app/data
      - blockchain_logs:/app/logs
    networks:
      - egovern-network
    # Désactiver le healthcheck temporairement pour debug
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 60s
    #   timeout: 30s
    #   retries: 5
    #   start_period: 120s
    restart: "no"  # Pas de redémarrage automatique pour debug

  # Interface Web (Nginx + HTML/JS)
  web-interface:
    build:
      context: .
      dockerfile: Dockerfile.web-only
    container_name: egovern-webapp-real
    ports:
      - "8080:80"  # Interface web sur le port 8080
    depends_on:
      blockchain-server:
        condition: service_healthy
    networks:
      - egovern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  blockchain_data:
    driver: local
  blockchain_logs:
    driver: local

networks:
  egovern-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16