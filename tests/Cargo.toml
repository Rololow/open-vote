[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
description = "Tests d'intégration pour le système e-gouvernement"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "phase5_promotion_tests"
path = "phase5_promotion_tests.rs"

[dependencies]
tokio = { workspace = true }
common = { path = "../common", features = ["identity"] }
crypto-lib = { path = "../crypto-lib" }
uuid = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
hex = { workspace = true }
chrono = { workspace = true }

[features]
default = []
identity = ["common/identity"]

[dev-dependencies]
tokio-test = "0.4"
