[package]
name = "blockchain-analyzer-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blockchain-analyzer-web"
path = "src/main.rs"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
gloo = { version = "0.11", features = ["net", "storage", "timers"] }
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "wasm-bindgen"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[dependencies.common]
path = "../common"

[dependencies.crypto-lib]
path = "../crypto-lib"