# Docker Compose pour E-Government Blockchain avec interface web

services:
  # Serveur blockchain backend
  blockchain-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockchain-server
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - BLOCKCHAIN_PORT=8080
      - BLOCKCHAIN_HOST=0.0.0.0
    volumes:
      - blockchain_data:/app/data
      - ./logs:/app/logs
    networks:
      - blockchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Interface web frontend
  web-interface:
    build:
      context: ./web-interface
      dockerfile: Dockerfile
    container_name: web-interface
    ports:
      - "3000:80"
    depends_on:
      blockchain-server:
        condition: service_healthy
    networks:
      - blockchain-network
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://blockchain-server:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  blockchain_data:
    driver: local

networks:
  blockchain-network:
    driver: bridge