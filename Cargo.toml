[workspace]
members = [
    "blockchain-server",
    "crypto-lib",
    "common",
    "wallet-cli",
    "web-interface",
    "tests"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"

# Web dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
yew = "0.21"
gloo = "0.11"
wasm-bindgen = "0.2"
web-sys = "0.3"

# Database
sqlite = "0.32"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Votre nom <votre.email@example.com>"]
description = "Système d'e-gouvernement décentralisé basé sur blockchain"
license = "MIT OR Apache-2.0"
