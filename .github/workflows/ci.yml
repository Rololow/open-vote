name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (all targets)
        run: cargo build --workspace --all-targets

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Headless CI flow (POSIX)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          chmod +x scripts/ci_wallet_headless.sh
          ./scripts/ci_wallet_headless.sh --passphrase "${{ secrets.WALLET_PASSPHRASE }}" --node-url http://127.0.0.1:3000
        continue-on-error: true

      - name: Headless CI flow (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/ci_wallet_headless.ps1 -Passphrase "${{ secrets.WALLET_PASSPHRASE }}" -NodeUrl http://127.0.0.1:3000
        continue-on-error: true
