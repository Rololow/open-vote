version: '3.8'

services:
  # Serveur blockchain
  blockchain-server:
    build:
      context: .
      dockerfile: Dockerfile.blockchain-only
    container_name: egovern-blockchain
    ports:
      - "8080:8080"
    volumes:
      - blockchain_data:/app/data
      - blockchain_logs:/app/logs
    environment:
      - BLOCKCHAIN_BIND_ADDRESS=0.0.0.0
      - BLOCKCHAIN_API_PORT=8080
      - BLOCKCHAIN_DATABASE_URL=sqlite:./data/blockchain.db
      - RUST_LOG=info
    networks:
      - egovern-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Interface web
  web-interface:
    build:
      context: .
      dockerfile: Dockerfile.web-only
    container_name: egovern-webapp
    ports:
      - "3000:80"
    depends_on:
      blockchain-server:
        condition: service_healthy
    networks:
      - egovern-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volumes persistants
volumes:
  blockchain_data:
    driver: local
  blockchain_logs:
    driver: local

# Réseau pour la communication inter-conteneurs
networks:
  egovern-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16